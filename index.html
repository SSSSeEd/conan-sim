<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Dela+Gothic+One&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 捜査デスク。左に捜査ログ、中央に対戦卓（相手が上・自分が下）、右にカード詳細。 */
:root{
  --desk:#13202b;       /* 卓のフェルト（紺鼠） */
  --desk-2:#1a2b38;
  --line:#2c4253;
  --ink:#e8eef2;
  --ink-dim:#93a7b6;
  --manila:#d9b26a;     /* FILE（マニラ封筒）＝アクセント */
  --manila-ink:#2a1e08;
  --alert:#e0584f;
  --ok:#5fbf8f;
  --card-bg:#f4f1ea;
  --card-ink:#1b1b1b;
  --c-blue:#2f6fd6; --c-red:#d6443a; --c-yellow:#e2b52b; --c-green:#3e9a52; --c-white:#cfd6dc; --c-black:#3a3a40;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:13px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box}
button{font-family:inherit;font-size:12px;background:var(--desk-2);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 9px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--manila);color:#fff}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,.card:focus-visible{outline:2px solid var(--manila);outline-offset:2px}
button.primary{background:var(--manila);color:var(--manila-ink);border-color:var(--manila);font-weight:700}
button.danger{border-color:var(--alert);color:#ffd9d6}
input,textarea,select{font-family:inherit;background:#0e1820;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px}
h1{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0;letter-spacing:.04em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

#app{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px;height:100%;min-height:0}
@media (max-width:1100px){#app{grid-template-columns:minmax(0,1fr);height:auto}}
#mid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:stretch;min-width:1040px;margin-inline:auto}
#guide{background:var(--manila);color:var(--manila-ink);border-radius:6px;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;gap:3px;font-size:13px;line-height:1.5}
#guide b{font-family:var(--f-display);font-weight:400;font-size:15px}
#guide.wait{background:#24384a;color:var(--ink)}
#guide.target{background:var(--alert);color:#fff}
#log{background:#0e1820;border:1px solid var(--line);border-radius:6px;padding:6px 10px;overflow-y:auto;font-size:13px;line-height:1.6;height:118px}
#log div{padding-left:8px;border-left:3px solid transparent}
#log .me{border-left-color:#4f8fe8}
#log .op{border-left-color:var(--alert)}
#log div:last-child{background:rgba(217,178,106,.12)}
#log .t{color:var(--manila);font-weight:700;margin-top:4px;border-left-color:var(--manila)}
#log .w{color:#ffb4ad}
#log .n{color:var(--ink-dim)}
#center{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
#topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#topbar .phase{font-family:var(--f-display);font-size:14px;color:var(--manila)}
#board{flex:1;overflow:auto;background:radial-gradient(ellipse at center,var(--desk-2),var(--desk) 75%);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0}
.side{display:grid;grid-template-columns:250px 490px 150px;gap:8px 12px;align-items:center;justify-content:center;
  grid-template-areas:"sp field piles" "sp file piles" "hand hand hand"}
.side.opp{grid-template-areas:"hand hand hand" "sp file piles" "sp field piles"}
.side>.special{grid-area:sp}.side>.slots{grid-area:field}.side>.pinfo{grid-area:piles}.side>.hand{grid-area:hand}.side>.fzwrap{grid-area:file;display:flex;flex-direction:column;gap:4px;min-width:0}
.filez.evz{background:rgba(93,143,191,.07);border-color:rgba(93,143,191,.4)}
.filez.evz .flabel{color:#8fb8e0}
.evz .fcard{background:repeating-linear-gradient(45deg,#24496b,#24496b 4px,#1a3650 4px,#1a3650 8px);border-color:#5d8fbf}
.evz .fcard.up{background:var(--card-bg);color:var(--card-ink);font-size:8px;font-weight:700;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;overflow:hidden}
.evz .fghost.goal{border-color:#e0a24f;color:#e0a24f}
/* ヒラメキチェックの演出 */
#reveal{position:fixed;inset:0;z-index:45;background:rgba(4,8,12,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;animation:rvfade .2s ease}
#reveal .rvt{font-family:var(--f-display);color:var(--manila);font-size:20px;letter-spacing:.05em;text-shadow:0 2px 8px #000}
#reveal .rvs{color:var(--ink);font-size:13px;min-height:1.4em;text-align:center;max-width:90vw}
#reveal .flip{width:200px;height:280px;perspective:900px}
#reveal .fin{position:relative;width:100%;height:100%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;animation:rvflip .7s .35s ease forwards}
#reveal .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
#reveal .back{width:auto;height:auto;border-radius:10px;border:3px solid #5d8fbf;background:repeating-linear-gradient(45deg,#24496b,#24496b 8px,#1a3650 8px,#1a3650 16px)}
#reveal .front{transform:rotateY(180deg)}
#reveal .front .card{width:200px;height:280px;border-radius:10px;border-width:3px}
#reveal .front .card .nm{font-size:16px}#reveal .front .card .st,#reveal .front .card .tp{font-size:12px}#reveal .front .card .lv{width:24px;height:24px;font-size:15px}
#reveal.hit .flip{animation:rvglow 1s 1.05s ease 2}
#reveal.hit .rvs{color:#ffd77a;font-weight:700}
@keyframes rvflip{from{transform:rotateY(0) scale(.85)}60%{transform:rotateY(200deg) scale(1.06)}to{transform:rotateY(180deg) scale(1)}}
@keyframes rvglow{50%{filter:drop-shadow(0 0 22px #ffd77a)}}
@keyframes rvfade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){#reveal .fin,#reveal.hit .flip{animation:none}#reveal .fin{transform:rotateY(180deg)}}
.side.active-turn{background:rgba(217,178,106,.05);border-radius:8px}
.side.active-turn .pname{color:var(--manila)}
.slots{display:flex;gap:14px;min-height:130px;align-items:center;justify-content:center;flex-wrap:nowrap}
.slot{width:86px;height:118px;flex:none;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center}
.pinfo{display:grid;grid-template-columns:repeat(2,64px);gap:6px 10px;align-items:end;justify-items:center;font-size:11px}
.stack{position:relative;width:60px;height:84px;border-radius:5px;cursor:pointer;background:repeating-linear-gradient(45deg,#2a4258,#2a4258 4px,#1d3142 4px,#1d3142 8px);border:1px solid #4a6378}
.stack.ev{background:repeating-linear-gradient(45deg,#24496b,#24496b 4px,#1a3650 4px,#1a3650 8px);border-color:#5d8fbf}
.stack.rm{background:var(--card-bg);color:var(--card-ink);border-color:#9a948a;display:flex;align-items:flex-end;padding:3px;box-sizing:border-box;font-size:9px;font-weight:700;line-height:1.2;overflow:hidden}
.stack.empty{background:none;border:1px dashed var(--line);box-shadow:none!important}
.stack .cnt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-num);font-weight:700;font-size:18px;color:#fff;text-shadow:0 1px 3px #000}
.stack.rm .cnt{top:auto;bottom:auto;transform:translate(-50%,-90%);color:var(--card-ink);text-shadow:none}
.plabel{text-align:center;color:var(--ink-dim);margin-top:3px}
.plabel b{color:var(--ink);font-family:var(--f-num)}
.filez{display:flex;align-items:center;gap:10px;cursor:pointer;background:rgba(217,178,106,.06);border:1px dashed rgba(217,178,106,.35);border-radius:6px;padding:5px 8px;height:76px;box-sizing:border-box}
.filez .flabel{font-family:var(--f-display);color:var(--manila);font-size:13px;line-height:1.1;text-align:center;flex:none;width:52px}
.filez .flabel b{font-family:var(--f-num);font-size:24px;display:block}
.fstack{position:relative;flex:1;height:64px}
.fcard{position:absolute;top:0;width:46px;height:64px;border-radius:4px;background:repeating-linear-gradient(45deg,#6b5627,#6b5627 4px,#574521 4px,#574521 8px);border:1px solid var(--manila);box-shadow:1px 1px 3px rgba(0,0,0,.6)}
.fcard.partner{background:var(--card-bg);color:var(--card-ink);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl}
.fghost{position:absolute;top:0;width:46px;height:64px;border-radius:4px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:18px;color:#3d5568}
.fghost.goal{border-color:var(--manila);color:var(--manila)}
.fghost.goal::after{content:attr(data-goal);position:absolute;bottom:-1px;font-size:8px;font-family:var(--f-body)}
.card.ready{border-color:var(--ok)}
.pname{font-family:var(--f-display);font-size:13px;grid-column:1/-1;justify-self:start}
.pile{background:#0e1820;border:1px solid var(--line);border-radius:5px;padding:3px 4px;text-align:center;min-width:48px;cursor:pointer;font-size:11px}
.pile b{display:block;font-family:var(--f-num);font-size:17px}
.pile.file{border-color:var(--manila)} .pile.file b{color:var(--manila)}
.pile.ev b{color:#9fd3ff}
.special{display:flex;gap:6px;justify-content:flex-end}
.special>*{width:120px;height:120px;display:flex;align-items:center;justify-content:center}
.special>.slot{width:86px;height:118px}
.hand{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:70px;padding:4px}
.hand .card{width:86px;height:118px}
.backs{display:flex;gap:3px;justify-content:center;align-items:center;color:var(--ink-dim)}
.back{width:22px;height:32px;border-radius:3px;background:repeating-linear-gradient(45deg,#24384a,#24384a 3px,#1b2c3a 3px,#1b2c3a 6px);border:1px solid var(--line)}

.card{position:relative;width:86px;height:118px;border-radius:6px;background:var(--card-bg);color:var(--card-ink);overflow:hidden;cursor:pointer;
  box-shadow:0 2px 5px rgba(0,0,0,.45);transition:transform .25s ease;flex:none;user-select:none;border:2px solid transparent}
.card.h{width:118px;height:86px}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .tx{position:absolute;inset:0;display:flex;flex-direction:column;padding:4px 5px 4px 9px;gap:2px}
.card.hasimg .tx{background:linear-gradient(to bottom,rgba(244,241,234,.0) 45%,rgba(244,241,234,.92) 70%)}
.card .stripe{position:absolute;left:0;top:0;bottom:0;width:5px;display:flex;flex-direction:column}
.card .stripe i{flex:1}
.card .lv{font-family:var(--f-num);font-weight:700;font-size:15px;line-height:1;background:var(--card-ink);color:var(--card-bg);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.card .nm{font-weight:700;font-size:11px;line-height:1.2;word-break:break-all;margin-top:auto}
.card .tp{font-size:9px;color:#555}
.card .st{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:11px;font-weight:700}
.card .ap.up{color:#0a7a3a}.card .ap.down{color:#b0261d}
.card .badge{position:absolute;top:3px;right:3px;font-size:9px;background:var(--manila);color:var(--manila-ink);border-radius:3px;padding:0 3px;font-weight:700}
.card .kw{position:absolute;top:18px;right:3px;font-size:9px;background:#203040;color:#fff;border-radius:3px;padding:0 3px}
.card.s-s{transform:rotate(90deg) scale(.82)}
.card.h.s-s{transform:rotate(90deg)}
.card.s-x{transform:rotate(180deg)}
.special .card.s-s{transform:rotate(90deg)}
.card.sel{border-color:var(--manila);box-shadow:0 0 0 3px rgba(217,178,106,.4)}
.card.tgt{border-color:var(--alert);animation:pulse 1s infinite}
.card.playable{border-color:var(--ok)}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(224,88,79,.5)}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card.tgt{animation:none}}
.card.facedown{background:repeating-linear-gradient(45deg,#24384a,#24384a 4px,#1b2c3a 4px,#1b2c3a 8px)}
.case-tag{position:absolute;bottom:3px;right:3px;font-size:9px;background:var(--alert);color:#fff;border-radius:3px;padding:0 4px}

#detail{background:#0e1820;border:1px solid var(--line);border-radius:6px;padding:10px;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:8px}
#detail .dn{font-family:var(--f-display);font-size:15px}
#detail .meta{color:var(--ink-dim);font-size:12px}
#detail .eff{white-space:pre-wrap;line-height:1.6;font-size:12.5px}
#detail .eff .k{color:var(--manila)}
#detail .acts{display:flex;flex-wrap:wrap;gap:5px}
#detail details{flex-basis:100%}
#detail summary{cursor:pointer;color:var(--ink-dim);font-size:12px;padding:4px 0}
#detail details .acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
#detail .acts button.rule{font-size:13px;padding:7px 12px;border-color:var(--ok)}
#detail .selhead{font-size:11px;color:var(--manila);letter-spacing:.06em}
#selPane,#hoverPane{display:flex;flex-direction:column;gap:8px}
#hoverPane:not(:empty){border-top:1px dashed var(--line);padding-top:8px;opacity:.85}
#detail .selbar{display:flex;justify-content:space-between;align-items:center;gap:6px}
#detail h3{font-size:11px;letter-spacing:.08em;color:var(--ink-dim);margin:6px 0 0;font-weight:500}

/* ===== スマホ（compact） ===== */
button,.card,.stack,.filez{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html.compact body{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:6px;font-size:12px}
html.compact #app{display:block;height:auto}
html.compact #topbar{gap:5px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--desk);padding-block:4px}
html.compact #topbar h1{display:none}
html.compact #topbar button{padding:6px 8px;font-size:11px}
html.compact #board{padding:4px;gap:6px;overflow:visible}
html.compact #mid{grid-template-columns:minmax(0,1fr);min-width:0;gap:4px}
html.compact #guide{padding:5px 8px;font-size:11px;line-height:1.4}
html.compact #guide b{font-size:12px}
html.compact #log{height:58px;font-size:11px;line-height:1.45;padding:3px 6px}
html.compact .card{width:56px;height:77px;border-width:1.5px;border-radius:4px}
html.compact .card.h{width:77px;height:56px}
html.compact .hand .card{width:56px;height:77px}
html.compact .card .lv{width:15px;height:15px;font-size:10px}
html.compact .card .tp{display:none}
html.compact .card .nm{font-size:8.5px}
html.compact .card .st{font-size:8px}
html.compact .card .tx{padding:2px 2px 2px 6px;gap:0}
html.compact .card .stripe{width:3px}
html.compact .card .badge,html.compact .card .kw,html.compact .case-tag{font-size:7.5px;padding:0 2px}
html.compact .card .kw{top:13px}
html.compact .side{grid-template-columns:170px 330px 96px;gap:4px 6px}
html.compact .slots{gap:8px;min-height:84px}
html.compact .slot{width:56px;height:77px}
html.compact .special>*{width:80px;height:80px}
html.compact .special>.slot{width:56px;height:77px}
html.compact .pinfo{grid-template-columns:repeat(2,44px);gap:3px 6px;font-size:9px}
html.compact .stack{width:40px;height:56px}
html.compact .stack .cnt{font-size:14px}
html.compact .stack.rm{font-size:7px}
html.compact .pname{font-size:11px}
html.compact .filez{height:54px;padding:3px 5px;gap:5px}
html.compact .filez .flabel{width:34px;font-size:10px}
html.compact .filez .flabel b{font-size:17px}
html.compact .fstack{height:46px}
html.compact .fcard,html.compact .fghost{width:32px;height:46px;font-size:13px}
html.compact .hand{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;min-height:50px;padding:3px 2px;scrollbar-width:none}
html.compact .backs .back{width:14px;height:20px}
/* 縦持ち: 現場・FILE・事件/パートナー/山札・手札を縦に積む */
html.compact.portrait .side{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"field field" "file file" "sp piles" "hand hand"}
html.compact.portrait .side.opp{grid-template-areas:"hand hand" "sp piles" "file file" "field field"}
html.compact.portrait .special{justify-content:flex-start}
html.compact.portrait .pinfo{grid-template-columns:repeat(3,44px)}
html.compact.portrait .pname{grid-column:1/-1}
/* カード詳細と操作は下から出るパネル */
html.compact #detail{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:58vh;border-radius:12px 12px 0 0;border-color:var(--manila);
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  box-shadow:0 -8px 30px rgba(0,0,0,.6);transform:translateY(105%);transition:transform .2s ease}
html.compact #detail.open{transform:none}
html.compact #hoverPane{display:none}
html.compact #detail .acts button{padding:8px 10px;font-size:12px}
html.compact #modal{padding:12px;max-height:85vh}
html.compact #modal .card{width:62px;height:85px}
html.compact #setup textarea{height:140px}
@media (prefers-reduced-motion:reduce){html.compact #detail{transition:none}}

/* ===== スマホ縦（ポケポケ風） ===== */
#topbar .tb-only{display:none}
html.compact.portrait #topbar .tb-only{display:inline-block}
html.compact.portrait #topbar .meta{display:none}
html.compact.portrait #topbar .phase{background:rgba(217,178,106,.16);border:1px solid var(--manila);border-radius:999px;padding:3px 12px;font-size:13px;margin-right:auto}
html.compact.portrait #topbar .tb-extra{display:none}
html.compact.portrait.menuopen #topbar .tb-extra{display:inline-block}
html.compact.portrait #board{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
html.compact.portrait #guide{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.compact.portrait #guide br{display:none}
html.compact.portrait #log{height:38px}
html.compact.portrait.logopen #log{position:fixed;left:8px;right:8px;top:calc(46px + env(safe-area-inset-top,0px));height:62vh;z-index:40;box-shadow:0 10px 40px rgba(0,0,0,.7);border-color:var(--manila)}
html.compact.portrait .fab{position:fixed;right:max(10px,env(safe-area-inset-right,0px));z-index:26;box-shadow:0 4px 14px rgba(0,0,0,.55)}
html.compact.portrait .tb-end{bottom:calc(132px + env(safe-area-inset-bottom,0px));width:70px;height:70px;border-radius:50%!important;padding:0!important;font-size:12px!important;font-weight:700;line-height:1.2}
html.compact.portrait .tb-hint{bottom:calc(210px + env(safe-area-inset-bottom,0px));border-radius:999px!important;padding:8px 10px!important;font-size:11px!important;background:#1d3446}
html.compact.portrait .fab:disabled{opacity:.35}
/* 手札は画面下に扇形 */
html.compact.portrait .side.me .hand{position:fixed;left:0;right:0;bottom:0;z-index:25;height:calc(120px + env(safe-area-inset-bottom,0px));
  padding:0 8px env(safe-area-inset-bottom,0px);display:flex;gap:0;justify-content:center;align-items:flex-end;overflow:visible;
  background:linear-gradient(to top,rgba(5,10,14,.95) 55%,rgba(5,10,14,0))}
html.compact.portrait .side.me .hand .card{width:68px;height:95px;flex:none;transform-origin:50% 100%;
  transform:translateY(var(--y,0px)) rotate(var(--r,0deg));transition:transform .15s ease;margin-bottom:6px;box-shadow:0 4px 10px rgba(0,0,0,.5)}
html.compact.portrait .side.me .hand .card.playable{transform:translateY(calc(var(--y,0px) - 10px)) rotate(var(--r,0deg));box-shadow:0 0 0 2px var(--ok),0 0 14px rgba(120,220,140,.55)}
html.compact.portrait .side.me .hand .card.sel{transform:translateY(calc(var(--y,0px) - 22px)) rotate(0deg);z-index:2}
html.compact.portrait .side.me .hand .card .nm{font-size:9px}
/* カードをタップ: 大きく表示して操作ボタン */
html.compact #detail.zoom{top:0;max-height:none;border:0;border-radius:0;background:rgba(4,8,12,.9);box-shadow:none;overflow-y:auto;
  padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(18px + env(safe-area-inset-bottom,0px));transform:none;opacity:0;pointer-events:none;transition:opacity .15s ease}
html.compact #detail.zoom.open{opacity:1;pointer-events:auto}
html.compact #detail.zoom #selPane{max-width:440px;margin:0 auto}
.zoomcard{display:none}
html.compact .zoomcard{display:flex;justify-content:center;margin:4px 0 12px}
html.compact .zoomcard .card{width:min(56vw,230px);height:calc(min(56vw,230px)*1.4);border-radius:10px;border-width:3px;box-shadow:0 10px 40px rgba(0,0,0,.7);cursor:default}
html.compact .zoomcard .card.h{width:min(80vw,320px);height:calc(min(80vw,320px)*.715)}
html.compact .zoomcard .card .nm{font-size:15px}
html.compact .zoomcard .card .st,html.compact .zoomcard .card .tp{font-size:12px;display:block}
html.compact .zoomcard .card .lv{width:24px;height:24px;font-size:15px}
html.compact .zoomcard .card .stripe{width:6px}
html.compact .zoomcard .card .badge,html.compact .zoomcard .card .kw{font-size:11px}
html.compact #detail.zoom .acts{gap:8px}
html.compact #detail.zoom .acts button{padding:12px 14px;font-size:14px;flex:1 1 40%;border-radius:10px}
html.compact #detail.zoom .eff{font-size:13px;line-height:1.6}
html.compact #detail.zoom .dn{font-size:17px}
html.compact:not(.portrait) #detail.zoom #selPane{max-width:820px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 18px;align-items:start}
html.compact:not(.portrait) #detail.zoom #selPane>*{grid-column:2}
html.compact:not(.portrait) #detail.zoom #selPane>.zoomcard{grid-column:1;grid-row:1/span 30;margin:0}
html.compact:not(.portrait) .zoomcard .card{height:min(78vh,330px);width:calc(min(78vh,330px)/1.4)}
html.compact:not(.portrait) .zoomcard .card.h{width:min(60vw,420px);height:calc(min(60vw,420px)*.715)}
@media (prefers-reduced-motion:reduce){html.compact.portrait .side.me .hand .card,html.compact #detail.zoom{transition:none}}

.card.ng{opacity:.45;filter:grayscale(.6);cursor:default}
.card .ngtag{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-12deg);background:#3a2a2a;color:#ffb4ad;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap;z-index:3}
.card .ordn{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;background:var(--manila);color:#1a1206;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.5)}

<script>
"use strict";
// ================= データ =================
const DB={},DBU={};for(const c of window.CARD_DB){DB[c.n]=c;DBU[c.n.toUpperCase()]=c.n}
// 画像: 同じフォルダの images/ を優先し、無ければ公式サイトから読む
const IMG={local:location.protocol==="file:",bundle:location.protocol!=="file:",lok:0,lng:0,on:true,ok:0,ng:0};
const IMGB={};
function bundleKey(pk){pk=pk||"misc";return /^[A-Za-z0-9-]+$/.test(pk)?pk:pk.startsWith("SP")?"SP":"PR"}
function loadBundle(pk){
  if(IMGB[pk])return IMGB[pk].p;
  const e=IMGB[pk]={data:null};
  e.p=fetch(`img/${pk}.json`).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{e.data=d;return d}).catch(()=>{IMG.bundle=false;return null});
  return e.p;
}const IMG_BASE="https://www.takaratomy.co.jp/products/conan-cardgame/storage/card/";
const COLOR_VAR={"青":"--c-blue","赤":"--c-red","黄":"--c-yellow","緑":"--c-green","白":"--c-white","黒":"--c-black"};
const BANNED=["0208","0050"],LIMIT1=["0002","0624"];
const SAMPLE_DECK={name:"白（X3zM3U7m）",text:`パートナー B01042
事件 D03016
B06066 x3
B03046 x3
PR149 x3
B02038 x3
B04042 x2
B06055 x2
D03006 x1
D03015 x2
D06012 x3
B01055 x3
B02044 x3
B02049 x3
B10045 x3
D03005 x3
B04040 x3`};

const PRESETS=[SAMPLE_DECK,{"name": "黒試し（RVVutYH1）", "text": "パートナー B03107\n事件 B06105\nB05108 x3\nB06099 x2\nB10086 x3\nB10087 x3\nB03111 x3\nB06104 x3\nPR310 x3\nB03116 x3\nD07012 x3\nD07019 x3\nB08089 x2\nD07016 x3\nB04095 x3\nB03132 x3"},{"name": "サッカー4（hlxo2zIa）", "text": "パートナー B10002\n事件 B10019\nB10003 x3\nB10004 x3\nB10005 x2\nB10007 x2\nB10013 x3\nB10017 x1\nB10012 x3\nD01005 x3\nD01015 x2\nD01013 x2\nB03011 x1\nB10016 x3\nB01023 x2\nB09009 x1\nB10008 x3\nB10018 x3\nD01014 x3"},{"name": "青単SOSアグロ（sgsSBbDE）", "text": "パートナー B04002Sec1\n事件 B05024\nD01002 x3\nB01009 x3\nB01010 x3\nB03015 x3\nD01005 x3\nD01012 x3\nD01003 x3\nD01013 x3\nB04010 x2\nD01010 x2\nD08015 x1\nD08016 x2\nB05010 x2\nD01011 x1\nD08018 x1\nPR182 x3\nD01014 x2"}];
function parseDeckText(text){
  const res={partner:null,caseN:null,main:[],errors:[]};
  const tokens=[];
  for(let line of text.split(/\n|,|、/)){
    line=line.trim();if(!line)continue;
    const m=line.match(/([A-Z]{1,2}\d{2,3}[A-Z0-9]*|PR\d{3}[A-Z]?)/i);
    if(!m){continue}
    const n=DBU[m[1].toUpperCase()]||m[1].toUpperCase();
    let cnt=1;const rest=line.replace(m[1],"");
    const cm=rest.match(/[x×*]\s*(\d+)|(\d+)\s*枚|^\s*(\d+)\s|\s(\d+)\s*$/i);
    if(cm)cnt=parseInt(cm[1]||cm[2]||cm[3]||cm[4]);
    const pre=line.slice(0,line.indexOf(m[1]));
    const lead=pre.match(/^(\d+)\s*$/);if(lead)cnt=parseInt(lead[1]);
    tokens.push({n,cnt,hint:/パートナー/.test(line)?"p":/事件/.test(line)?"c":""});
  }
  for(const t of tokens){
    const c=DB[t.n];if(!c){res.errors.push(`不明なカードNo: ${t.n}`);continue}
    if(c.t==="パートナー"||t.hint==="p"&&c.t==="パートナー"){res.partner=t.n;continue}
    if(c.t==="事件"){res.caseN=t.n;continue}
    for(let i=0;i<t.cnt;i++)res.main.push(t.n);
  }
  return res;
}
function validateDeck(d){
  const w=[];
  if(!d.partner)w.push("パートナーがありません");
  if(!d.caseN)w.push("事件がありません");
  if(d.main.length!==40)w.push(`デッキが${d.main.length}枚です（40枚ちょうどが必要）`);
  const byId={};
  for(const n of d.main){const c=DB[n];byId[c.i]=(byId[c.i]||[]);byId[c.i].push(c)}
  for(const [id,cs] of Object.entries(byId)){
    const any=cs.some(c=>(c.f||"").includes("何枚でも"));
    if(BANNED.includes(id))w.push(`禁止カード: ${cs[0].nm}（${id}）`);
    if(LIMIT1.includes(id)&&cs.length>1)w.push(`制限カード（1枚まで）: ${cs[0].nm}`);
    if(cs.length>3&&!any)w.push(`同じIDが${cs.length}枚: ${cs[0].nm}（3枚まで）`);
  }
  return w;
}
function deckToText(d){
  const cnt={};for(const n of d.main)cnt[n]=(cnt[n]||0)+1;
  return `パートナー ${d.partner}\n事件 ${d.caseN}\n`+Object.entries(cnt).map(([n,k])=>`${n} x${k}`).join("\n");
}
async function fetchShareDeck(id){
  const r=await fetch(`https://conan-tcg-app.com/api/deck/share?share_id=${encodeURIComponent(id)}`,{headers:{Accept:"application/json"}});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();const k=j.deck;
  return {name:k.name,text:deckToText({partner:k.partner_num,caseN:k.case_card_num,main:k.card_num_list})};
}
function randomDeck(color){
  const pool=window.CARD_DB.filter(c=>(c.t==="キャラ"||c.t==="イベント")&&c.c===color&&!/P$/.test(c.n)&&!BANNED.includes(c.i));
  const byId={};for(const c of pool)if(!byId[c.i])byId[c.i]=c;
  const uniq=Object.values(byId);shuffle(uniq);
  const curve={1:2,2:3,3:3,4:3,5:3,6:2,7:2,8:2,9:1};
  const main=[];
  for(const [lv,k] of Object.entries(curve)){
    const xs=uniq.filter(c=>c.lv==lv&&(c.t==="キャラ"||Math.random()<.4)).slice(0,k);
    for(const c of xs)for(let i=0;i<3&&main.length<40;i++)main.push(c.n);
  }
  let i=0;const chars=uniq.filter(c=>c.t==="キャラ"&&c.lv<=6);
  while(main.length<40&&i<chars.length*3){const c=chars[i%chars.length];if(main.filter(x=>DB[x].i===c.i).length<3)main.push(c.n);i++}
  const partners=window.CARD_DB.filter(c=>c.t==="パートナー"&&c.c===color&&!/P$/.test(c.n));
  const cases=window.CARD_DB.filter(c=>c.t==="事件"&&c.c===color&&/先攻7/.test(c.df||"")&&!/P$/.test(c.n));
  return {name:`ランダム（${color}）`,text:deckToText({partner:pick(partners).n,caseN:pick(cases).n,main:main.slice(0,40)})};
}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ================= 状態 =================
let G=null;let UID=1;
function inst(n){return {u:UID++,n,st:"a",fresh:false,apM:0,apT:0,apC:0,lpM:0,lpT:0,kw:[],set:[],used:{}}}
function C(x){return DB[x.n]}
function mkPlayer(idx,name,deck,cpu){
  const p={idx,name,cpu,deck:shuffle(deck.main.map(inst)),hand:[],field:[],partner:inst(deck.partner),pLoc:"area",
    caseC:inst(deck.caseN),solved:false,level:7,file:[],ev:[],rm:[],usedHand:false,hinted:false,refreshed:false,lost:false};
  return p;
}
const opp=p=>G.P[1-p.idx];
const cur=()=>G.P[G.turn];
function caseLevel(p,first){
  const t=C(p.caseC).df||"先攻7 後攻6";const m=t.match(/先攻\s*(\d+)\s*後攻\s*(\d+)/);
  if(!m)return 7;return first?+m[1]:+m[2];
}
function colorsOf(s){return [...(s||"")].filter(ch=>COLOR_VAR[ch])}
function apOf(x){const c=C(x);return (c.ap||0)+x.apM+x.apT+x.apC+(window.FX?FX.apBonus(x):0)}
function lpOf(x){const c=C(x);return (c.lp||0)+x.lpM+x.lpT}
function ownerOf(x){for(const p of G.P){if(p.field.includes(x)||p.partner===x||p.hand.includes(x)||p.caseC===x||p.file.includes(x)||p.ev.includes(x)||p.rm.includes(x)||p.deck.includes(x))return p}return null}
function zoneOf(x){const p=ownerOf(x);if(!p)return null;
  if(p.partner===x)return p.pLoc==="file"?"file":"partner";
  for(const z of ["field","hand","file","ev","rm","deck"])if(p[z].includes(x))return z;
  if(p.caseC===x)return "case";return null}
function detach(x){x._shown=null;const p=ownerOf(x);for(const z of ["field","hand","file","ev","rm","deck"]){const i=p[z].indexOf(x);if(i>=0){p[z].splice(i,1);return p}}return p}

// 条件タグの判定
function condOk(tag,p){
  let m;
  if((m=tag.match(/^パートナー(.+)$/)))return colorsOf(m[1]).every(ch=>(C(p.partner).c||"").includes(ch));
  if((m=tag.match(/^事件(.+)$/))){const want=m[1];const cc=C(p.caseC);const cols=colorsOf(want.replace(/＆/g,""));
    if(cols.length&&cols.length===want.replace(/＆/g,"").length)return cols.every(ch=>(cc.c||"").includes(ch));
    return (cc.ct||"").includes(want)||cc.nm.includes(want)}
  if(tag==="自分ターン中")return G.turn===p.idx;
  if(tag==="相手ターン中")return G.turn!==p.idx;
  if(tag==="解決編")return p.solved;
  if(tag==="事件編")return !p.solved;
  if((m=tag.match(/^絆(.+)$/)))return p.field.some(y=>C(y).nm.includes(m[1]));
  if((m=tag.match(/^FILE(\d+)$/)))return p.file.length>=+m[1];
  return null; // 判定対象外のタグ
}
// 常在キーワード（行頭の条件タグを満たした〚〛）
function staticKw(x,p){
  const out={rush:false,rushC:false,rushE:false,swift:false,bullet:false,misread:0};
  const c=C(x);
  for(const line of (c.f||"").split("\n")){
    let s=line.trim(),ok=true,m;
    while((m=s.match(/^【([^】]+)】/))){const r=condOk(m[1],p);if(r===false){ok=false}else if(r===null){ok=false}s=s.slice(m[0].length)}
    if(!ok)continue;
    if((m=s.match(/^〚([^〛]+)〛/))){const k=m[1];
      if(k==="突撃")out.rush=true;else if(k==="突撃［キャラ］")out.rushC=true;else if(k==="突撃［事件］")out.rushE=true;
      else if(k==="迅速")out.swift=true;else if(k==="ブレット")out.bullet=true;
      else if((m=k.match(/^ミスリード(\d+)/)))out.misread+=+m[1];}
  }
  for(const k of x.kw){if(k==="突撃")out.rush=true;if(k==="迅速")out.swift=true;if(k==="ブレット")out.bullet=true}
  return out;
}
function cutinAp(x,p){
  const t=C(x).ci;if(!t)return null;
  let best=null;
  for(const line of t.split("\n")){
    let s=line.replace("【カットイン】",""),ok=true,m;
    while((m=s.match(/^【([^】]+)】/))){const r=condOk(m[1],p);if(r===false)ok=false;s=s.slice(m[0].length)}
    if(!ok)continue;
    const a=s.match(/^AP[＋+](\d+)/);if(a)best=Math.max(best||0,+a[1]);
  }
  return best;
}
function disguiseOk(x,p){
  const t=C(x).dg;if(!t)return false;
  const tags=[...t.matchAll(/【([^】]+)】/g)].map(m=>m[1]).filter(s=>s!=="変装");
  return tags.every(tg=>condOk(tg,p)!==false);
}
function canPlayColor(card,p){const cc=C(p.caseC).c||"";return colorsOf(card.c).every(ch=>cc.includes(ch))}

// ================= ログ・UI補助 =================
function log(msg,cls){const d=document.createElement("div");if(!cls&&G){const nm=msg.replace(/^\[手動\] /,"");if(nm.startsWith(G.P[0].name))cls="me";else if(nm.startsWith(G.P[1].name))cls="op"}if(cls)d.className=cls;d.textContent=msg;const L=document.getElementById("log");L.appendChild(d);L.scrollTop=L.scrollHeight}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function esc(s){return String(s??"").replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]))}
function hl(s){return esc(s).replace(/(【[^】]+】|〚[^〛]+〛)/g,'<span class="k">$1</span>')}

// モーダル（Promise）
function modal(build){
  return new Promise(res=>{
    const bg=document.getElementById("modal-bg"),m=document.getElementById("modal");
    m.innerHTML="";bg.hidden=false;
    const done=v=>{bg.hidden=true;m.innerHTML="";res(v)};
    build(m,done);
    const f=m.querySelector("button");if(f)f.focus();
  });
}
function ask(title,body,options){ // options:[{label,value,primary}]
  return modal((m,done)=>{
    m.insertAdjacentHTML("beforeend",`<div class="mt">${esc(title)}</div>${body?`<div class="mb">${hl(body)}</div>`:""}<div class="opts"></div>`);
    const o=m.querySelector(".opts");
    for(const op of options){const b=document.createElement("button");b.textContent=op.label;if(op.primary)b.className="primary";b.onclick=()=>done(op.value);o.appendChild(b)}
  });
}
function chooseCards(title,body,cards,{min=0,max=1,okLabel="決定",faceUp=true,can=null}={}){
  return modal((m,done)=>{
    m.insertAdjacentHTML("beforeend",`<div class="mt">${esc(title)}</div>${body?`<div class="mb">${hl(body)}</div>`:""}<div class="cards"></div><div class="opts"></div>`);
    const sel=new Set();const box=m.querySelector(".cards");
    const ok=document.createElement("button");ok.className="primary";ok.textContent=okLabel;
    const upd=()=>{ok.disabled=sel.size<min||sel.size>max;ok.textContent=`${okLabel}（${sel.size}）`};
    for(const x of cards){const el=cardEl(x,{faceUp});
      const ow=G&&ownerOf(x);if(ow&&ow.field.includes(x))el.insertAdjacentHTML("beforeend",`<span class="case-tag" style="background:${ow.idx===0?"#2f6fd6":"var(--alert)"}">${esc(ow.name)}</span>`);
      if(can&&!can(x)){el.classList.add("ng");el.insertAdjacentHTML("beforeend",'<span class="ngtag">対象外</span>');el.onclick=()=>showDetail(x);box.appendChild(el);continue}
      el.onclick=()=>{
        if(sel.has(x)){sel.delete(x);el.classList.remove("sel")}else{if(max===1){sel.clear();box.querySelectorAll(".sel").forEach(e=>e.classList.remove("sel"))}if(sel.size<max){sel.add(x);el.classList.add("sel")}}upd()};
      box.appendChild(el)}
    ok.onclick=()=>done([...sel]);m.querySelector(".opts").appendChild(ok);upd();
    if(min===0){const n=document.createElement("button");n.textContent="選ばない";n.onclick=()=>done([]);m.querySelector(".opts").appendChild(n)}
  });
}

// 好きな順番でデッキの下へ: タップした順に 1,2,3… と番号を付ける（1 が上、最後が一番下）
function orderCards(title,cards){
  if(cards.length<2)return Promise.resolve(cards.slice());
  return modal((m,done)=>{
    m.insertAdjacentHTML("beforeend",`<div class="mt">${esc(title)}</div><div class="mb">デッキの下に戻す順番を、カードをタップして決めてください。①が上（先に引く側）、最後の番号がデッキの一番下になります。もう一度タップで取り消し。</div><div class="cards"></div><div class="opts"></div>`);
    const ord=[];const box=m.querySelector(".cards");const els=new Map();
    const ok=document.createElement("button");ok.className="primary";
    const upd=()=>{for(const [x,el] of els){const i=ord.indexOf(x);el.classList.toggle("sel",i>=0);const t=el.querySelector(".ordn");if(t)t.remove();if(i>=0)el.insertAdjacentHTML("beforeend",`<span class="ordn">${i+1}</span>`)}
      ok.disabled=ord.length!==cards.length;ok.textContent=ord.length===cards.length?"この順番で戻す":`あと${cards.length-ord.length}枚`};
    for(const x of cards){const el=cardEl(x);els.set(x,el);el.onclick=()=>{const i=ord.indexOf(x);if(i>=0)ord.splice(i,1);else ord.push(x);upd()};box.appendChild(el)}
    ok.onclick=()=>done(ord.slice());m.querySelector(".opts").appendChild(ok);
    const as=document.createElement("button");as.textContent="表示の順のまま";as.onclick=()=>done(cards.slice());m.querySelector(".opts").appendChild(as);upd();
  });
}

// ================= ゲーム処理 =================
function checkDeck(p){ // デッキ0枚で即リフレッシュ
  if(p.deck.length>0||G.over)return;
  if(p.rm.length===0){lose(p,"リフレッシュできない（リムーブエリア0枚）");return}
  p.deck=shuffle(p.rm.splice(0));p.refreshed=true;
  log(`${p.name} がリフレッシュ（デッキ${p.deck.length}枚）。${opp(p).name} は証拠を1つ得る`,"w");
  gainEvidence(opp(p),1);
}
function popDeck(p){if(G.over)return null;const x=p.deck.shift();checkDeck(p);return x}
function draw(p,n=1){for(let i=0;i<n;i++){const x=popDeck(p);if(x){x.st="a";p.hand.push(x)}}}
function gainEvidence(p,n=1){for(let i=0;i<n;i++){const x=popDeck(p);if(x){x.st="a";p.ev.push(x)}}}
function toFile(p,n=1){for(let i=0;i<n;i++){const x=popDeck(p);if(x){x.st="a";p.file.push(x)}}}
function resetMods(x){x.apM=0;x.apT=0;x.apC=0;x.lpM=0;x.lpT=0;x.kw=[];x.fresh=false;x.st="a"}
function removeCard(x,why,opt={}){ // リムーブエリアへ（現場からなら離れたときの効果を予約）
  const p=ownerOf(x);const wasField=p.field.includes(x);
  detach(x);resetMods(x);
  if(wasField){for(const s of x.set||[])p.rm.push(s.c);x.set=[]}
  p.rm.push(x);
  const c=C(x);
  if(why)log(`${p.name} の ${c.nm} をリムーブ（${why}）`);
  if(wasField&&G){G.queue.push({x,p,turn:G.turn,by:opt.by||null,effect:!!opt.effect});
    if(!(window.FX&&FX.automated(x))&&(c.f||"").includes("【現場リムーブ時】"))toast(`${c.nm}【現場リムーブ時】を確認`)}
}
async function runQueue(){while(G&&G.queue.length&&!G.over){const i=G.queue.shift();if(window.FX)await FX.onLeave(i);render()}}
function win(p,why){if(G.over)return;G.over=true;log(`★ ${p.name} の勝利（${why}）`,"t");render();
  ask("ゲーム終了",`${p.name} の勝利\n${why}`,[{label:"もう一度（同じデッキ）",value:"again",primary:true},{label:"デッキ選択に戻る",value:"setup"},{label:"盤面を見る",value:"view"}]).then(v=>{if(v==="again")startGame(G.cfg);else if(v==="setup")showSetup()})}
function lose(p,why){win(opp(p),`${p.name} の敗北: ${why}`)}

async function startGame(cfg){
  UID=1;
  G={cfg,P:[mkPlayer(0,cfg.names[0],cfg.decks[0],!!cfg.cpu0),mkPlayer(1,cfg.names[1],cfg.decks[1],cfg.cpu)],turn:0,turnNo:0,first:0,over:false,ui:{mode:null},queue:[],showOppHand:!cfg.cpu||!!cfg.cpu0};
  document.getElementById("setup").hidden=true;document.getElementById("app").hidden=false;
  document.getElementById("board").innerHTML=`<div id="oppSide"></div><div id="mid"><div id="guide"></div><div id="log" aria-live="polite"></div></div><div id="meSide"></div>`;
  _sel=null;document.getElementById("selPane").innerHTML=SEL_HINT;document.getElementById("hoverPane").innerHTML="";
  G.first=cfg.first==="rand"?Math.floor(Math.random()*2):+cfg.first;
  G.turn=G.first;
  for(const p of G.P)p.level=caseLevel(p,p.idx===G.first);
  log(`先攻: ${G.P[G.first].name}`,"t");
  for(const p of G.P){draw(p,5)}
  render();
  for(const i of [G.first,1-G.first]){const p=G.P[i];await mulligan(p)}
  for(const p of G.P)log(`${p.name}: パートナー ${C(p.partner).nm} / 事件 ${C(p.caseC).nm}（事件レベル${p.level}）`);
  beginTurn();
}
async function mulligan(p){
  let back;
  if(p.cpu){back=p.hand.filter(x=>(C(x).lv||0)>=7||!canPlayColor(C(x),p))}
  else{const fs=p.idx===G.first;back=await chooseCards(`${p.name}: マリガン（${fs?"先攻":"後攻"}）`,`【${fs?"先攻":"後攻"}】${p.name} は${fs?"先攻":"後攻"}です（${G.P[G.first].name} が先攻）。事件レベル ${p.level}。\nデッキに戻すカードを選んでください（何枚でも、1回まで）。`,p.hand,{min:0,max:5,okLabel:"戻して引き直す"})}
  if(back.length){for(const x of back)detach(x);p.deck.push(...back);shuffle(p.deck);draw(p,back.length);log(`${p.name} はマリガンで${back.length}枚引き直した`)}
  else log(`${p.name} はマリガンしない`);
  render();
}
function beginTurn(){
  if(G.over)return;
  const p=cur();G.turnNo++;p.usedHand=false;p.hinted=false;p.noHint=false;
  log(`— ${G.turnNo}ターン目: ${p.name} —`,"t");
  // オートフェイズ
  if(p.pLoc==="file"){p.file.splice(p.file.indexOf(p.partner),1);p.pLoc="area";log("パートナーがFILEからパートナーエリアに戻った")}
  p.partner.st="a";
  const keep=FX.keepStun(p);
  for(const x of p.field){if(x.st==="x"){if(!keep)x.st="s"}else x.st="a";x.fresh=false}
  if(keep&&p.field.some(x=>x.st==="x"))log("怪盗キッドの効果でスタン状態のキャラは起き上がらない","n");
  draw(p,1);
  const firstTurn=G.turnNo===1;
  toFile(p,firstTurn?1:2);
  log(`オートフェイズ: 1枚ドロー、FILEに${firstTurn?1:2}枚（FILE ${p.file.length}枚）`,"n");
  G.phase="main";render();
  if(p.cpu)cpuTurn(p);
}
async function endTurn(){
  if(G.over||G.ending)return;
  const p=cur();G.ending=true;
  await FX.endTurn(p);await runQueue();G.ending=false;
  if(G.over)return;
  const ends=[...p.field,...opp(p).field].filter(x=>/ターン終了時/.test(C(x).f||"")&&!FX.automated(x));
  if(ends.length)log(`ターン終了時の能力を確認: ${ends.map(x=>C(x).nm).join("、")}`,"n");
  for(const q of G.P)for(const x of [...q.field,q.partner]){x.apT=0;x.lpT=0;x.kw=[]}
  G.ui.mode=null;G.turn=1-G.turn;beginTurn();
}

// 手札の使用（ネクストヒント経由は viaHint）
function playableReason(p,x,viaHint){
  const c=C(x);
  if(G.turn!==p.idx)return "自分のターンではない";
  if(!viaHint&&p.usedHand)return "このターンはもう手札を使用した";
  if(!viaHint&&p.hinted)return "このターンはネクストヒントをした";
  const lv=(window.FX&&FX.handLevel(p,x))??(c.lv||0);
  if(lv>p.file.length)return `レベル${lv} > FILE${p.file.length}枚`;
  if(!canPlayColor(c,p))return `事件の色（${C(p.caseC).c}）と合わない`;
  return null;
}
async function useFromHand(p,x,viaHint=false){
  const r=playableReason(p,x,viaHint);if(r){toast(r);return false}
  const c=C(x);
  if(p.cpu&&!window.SIM_FAST){render();await cutin(x,`${p.name}: ${c.t==="キャラ"?"登場":"使用"}${viaHint?"（ネクストヒント）":""}`,c.t==="キャラ"?`${c.nm}（Lv${c.lv} AP${c.ap}）`:(c.f||"").split("\n")[0].slice(0,60),{who:p})}
  if(c.t==="キャラ"){
    if(p.field.length>=5){
      const t=p.cpu?[p.field.slice().sort((a,b)=>(C(a).lv||0)-(C(b).lv||0))[0]]:await chooseCards("スイッチ","現場が5体です。リムーブして入れ替えるキャラを選んでください。",p.field,{min:1,max:1});
      if(!t.length)return false;removeCard(t[0],"スイッチ");
    }
    detach(x);x.st="a";x.fresh=true;p.field.push(x);
    if(!viaHint)p.usedHand=true;
    log(`${p.name} は ${c.nm}（Lv${c.lv}）を登場させた${viaHint?"（ネクストヒント）":""}`);
    render();await runQueue();await FX.enter(p,x);
  }else{
    detach(x);p.rm.push(x);
    if(!viaHint)p.usedHand=true;
    log(`${p.name} はイベント ${c.nm} を使用した${viaHint?"（ネクストヒント）":""}`);
    render();await FX.event(p,x);
  }
  render();return true;
}
function noteEffect(p,x,kind){
  const c=C(x);log(`　効果【${kind}】: ${(c.f||"").replace(/\n/g," ")}`,"n");
  if(!p.cpu)toast(`${c.nm} の効果は手動で処理してください（右パネル）`);
  else toast(`CPUの ${c.nm} の効果は未自動化です。必要なら手動で処理`);
}
async function nextHint(p){
  if(p.hinted){toast("このターンはもうネクストヒントをした");return}
  if(p.noHint){toast("このターンはネクストヒントできない");return}
  const top=[...p.file].reverse().find(x=>x!==p.partner);
  if(!top){toast("FILEにカードがない");return}
  p.file.splice(p.file.indexOf(top),1);p.hand.push(top);p.hinted=true;
  log(`${p.name} はネクストヒント（FILE ${p.file.length}枚）。${p.cpu?"":C(top).nm+" を手札に"}`);
  render();
  if(p.cpu)return top;
  const ok=p.hand.filter(y=>!playableReason(p,y,true));
  const ch=await chooseCards("ネクストヒント: カードを使用",`FILE ${p.file.length}枚。使用するカードを1枚選んでください。`,ok,{min:0,max:1,okLabel:"使用"});
  if(ch.length)await useFromHand(p,ch[0],true);
  render();
}
async function assist(p){
  if(p.pLoc!=="area"||p.partner.st!=="a"){toast("パートナーがアクティブではない");return}
  p.partner.st="s";p.pLoc="file";p.file.push(p.partner);
  log(`${p.name} はアシスト（FILE ${p.file.length}枚）`);
  if(p.file.length>=7&&!p.solved){p.solved=true;log(`${p.name} の事件が解決編になった！`,"t");toast("解決編へ");render();await FX.solvedTrigger(p)}
  render();
}
function solve(p){
  if(p.pLoc!=="area"||p.partner.st!=="a"){toast("パートナーがアクティブではない");return}
  if(!p.solved){toast("事件がまだ事件編");return}
  p.partner.st="s";
  if(FX.eraseEvidence(p)){
    if(p.ev.length>=p.level){const gone=p.ev.splice(p.ev.length-p.level,p.level);p.rm.push(...gone);win(p,`証拠隠滅（証拠を${p.level}つリムーブ）で相手が敗北`)}
    else{log(`${p.name} は証拠隠滅を宣言したが証拠不足（${p.ev.length}/${p.level}）`,"w");render()}
    return}
  if(p.ev.length>=p.level)win(p,`事件解決（証拠${p.ev.length}/${p.level}）`);
  else{log(`${p.name} は事件解決を宣言したが証拠不足（${p.ev.length}/${p.level}）`,"w");render()}
}
function canAct(x,p,kind){ // kind: reason|chara|case
  if(x.st!=="a")return false;
  if(x===p.partner)return kind==="reason"&&p.pLoc==="area";
  if(!x.fresh)return true;
  const k=staticKw(x,p);
  if(k.swift)return true;
  if(kind==="chara")return k.rush||k.rushC;
  if(kind==="case")return k.rush||k.rushE;
  return false;
}
async function reason(p,x){
  if(!canAct(x,p,"reason")){toast("推理できない（スリープ中か名乗り状態）");return}
  x.st="s";
  let lp=x===p.partner?(C(x).lp||1)+x.lpT+x.lpM:lpOf(x);
  log(`${p.name} の ${C(x).nm} が推理（LP${lp}）`);
  await showCpu(p,x,"推理",`${C(x).nm}（LP${lp}）`);
  const o=opp(p);
  const mis=o.field.filter(y=>y.st==="a"&&staticKw(y,o).misread>0);
  if(mis.length){
    let use;
    if(o.cpu)use=mis.slice(0,Math.max(0,lp));
    else use=await chooseCards(`${o.name}: ミスリード`,`${C(x).nm} の推理（LP${lp}）に対し、ミスリードするキャラを選べます（スリープします）。`,mis,{min:0,max:mis.length,okLabel:"ミスリード"});
    for(const y of use){y.st="s";const v=staticKw(y,o).misread;lp-=v;log(`${o.name} の ${C(y).nm} がミスリード${v}（LP${lp}）`);
      render();await cutin(y,"ミスリード！",`${o.name} の ${C(y).nm}：${C(x).nm} の推理 LP−${v}（残りLP${Math.max(0,lp)}）`,{kind:"mis"})}
  }
  const n=Math.max(0,lp);gainEvidence(p,n);log(`${p.name} は証拠を${n}つ得た（証拠${p.ev.length}）`);
  clearAct();render();
}
async function declareAction(p,x,target){ // target: inst or "case"
  const kind=target==="case"?"case":"chara";
  if(!canAct(x,p,kind)){toast("アクションできない");return}
  const o=opp(p);
  if(kind==="chara"&&!(o.field.includes(target)&&(target.st==="s"||target.st==="x"))){toast("対象はスリープかスタン状態のキャラ");return}
  if(kind==="case"&&o.ev.length===0){toast("相手の証拠が0");return}
  await showCpu(p,x,"アクション",kind==="case"?`${C(x).nm}（AP${apOf(x)}）→ 事件（証拠を狙う）`:`${C(x).nm}（AP${apOf(x)}）→ ${C(target).nm}（AP${apOf(target)}）`,target);
  x.st="s";
  log(`${p.name} の ${C(x).nm}（AP${apOf(x)}）がアクション → ${kind==="case"?"事件":C(target).nm}`);
  render();await FX.onAction(p,x);
  const kw=staticKw(x,p);
  let guard=null;
  const guards=o.field.filter(y=>y.st==="a"||(y.st==="s"&&FX.canGuardSleeping(y)));
  if(!kw.bullet&&guards.length){
    if(o.cpu)guard=cpuGuard(o,x,target,guards);
    else{const g=await chooseCards(`${o.name}: ガード`,`${C(x).nm}（AP${apOf(x)}）が${kind==="case"?"事件":C(target).nm+"（AP"+apOf(target)+"）"}にアクション。アクティブなキャラをスリープしてガードできます。`,guards,{min:0,max:1,okLabel:"ガード"});guard=g[0]||null}
  }
  if(guard){if(guard.st==="a")guard.st="s";log(`${o.name} の ${C(guard).nm}（AP${apOf(guard)}）がガード`);
    if(o.cpu){render();await cutin(guard,`${o.name}: ガード`,`${C(guard).nm}（AP${apOf(guard)}）`,{who:o})}await contact(p,x,guard)}
  else if(kind==="chara")await contact(p,x,target);
  else{
    const e=o.ev.pop();log(`${o.name} の証拠を1つリムーブ`);
    await hirameki(o,e);
    gainEvidence(p,1);log(`${p.name} は証拠を1つ得た（証拠${p.ev.length}）`);
  }
  render();await runQueue();
  if(!G.over)await FX.actionEnd(p,x);
  clearAct();render();
}
// 証拠をめくって見せる（タップで早送り）
function revealCard(x,title,sub,hit){
  return new Promise(res=>{
    const d=document.createElement("div");d.id="reveal";if(hit)d.classList.add("hit");
    d.innerHTML=`<div class="rvt">${esc(title)}</div><div class="flip"><div class="fin"><div class="face back"></div><div class="face front"></div></div></div><div class="rvs"></div>`;
    d.querySelector(".front").appendChild(cardEl(x));
    document.body.appendChild(d);
    const rm=()=>{if(!d.isConnected)return;d.remove();res()};
    setTimeout(()=>{d.querySelector(".rvs").textContent=sub},1000);
    d.onclick=()=>{if(d.querySelector(".rvs").textContent)rm();else{d.querySelector(".rvs").textContent=sub;d.querySelectorAll(".fin").forEach(f=>{f.style.animation="none";f.style.transform="rotateY(180deg)"})}};
    setTimeout(rm,hit?2600:1900);
  })}
// 帯の演出（タップで早送り）。SIM_FAST のときは出さない（テスト用）
function cutin(x,title,sub,{who=null,kind="",ms=1300}={}){
  if(!G||window.SIM_FAST)return Promise.resolve();
  return new Promise(res=>{
    const d=document.createElement("div");d.className="cutin "+(kind||(who&&who.idx===0?"me":"op"));
    d.innerHTML=`<div class="band">${x?'<div class="ccard"></div>':""}<div><div class="ct">${esc(title)}</div>${sub?`<div class="cs">${esc(sub)}</div>`:""}</div></div>`;
    if(x)d.querySelector(".ccard").appendChild(cardEl(x));
    document.body.appendChild(d);
    let t;const end=()=>{if(d.classList.contains("out"))return;clearTimeout(t);d.classList.add("out");setTimeout(()=>{d.remove();res()},220)};
    d.onclick=end;t=setTimeout(end,ms);
  })}
// 相手(CPU)の行動を見せる: 行動するカードと対象を光らせ、帯で知らせる
async function showCpu(p,x,title,sub,target){
  if(!p.cpu||window.SIM_FAST)return;
  G.ui.act={a:x,t:target&&target!=="case"?target:null};render();
  await cutin(x,`${p.name}: ${title}`,sub,{who:p});
  await sleep(250);
}
function clearAct(){if(G&&G.ui.act){G.ui.act=null;render()}}
async function hirameki(o,e){
  const c=C(e);o.rm.push(e);
  render();await revealCard(e,`ヒラメキチェック（${o.name}）`,c.hr?`${c.nm}【ヒラメキ】あり！`:`${c.nm}（ヒラメキなし）`,!!c.hr);
  if(!c.hr)return;
  let use;
  if(o.cpu)use=true;
  else use=await ask(`${o.name}: ヒラメキ`,`リムーブされた証拠 ${c.nm}\n${c.hr}`,[{label:"発動する",value:true,primary:true},{label:"発動しない",value:false}]);
  if(!use)return;
  log(`${o.name} の ${c.nm}【ヒラメキ】発動`);
  if(await FX.hirameki(o,e)){render();return}
  if(/カードを1枚引く/.test(c.hr)&&!/選び/.test(c.hr)){draw(o,1);log(`　→ ${o.name} は1枚引いた`,"n")}
  else{log(`　${c.hr}`,"n");toast("ヒラメキの効果を手動で処理してください")}
}
async function contact(p,a,d){ // p=ターンプレイヤー(攻撃側)
  const o=opp(p);const ct={a,d};G.contact=ct;
  log(`コンタクト: ${C(a).nm} AP${apOf(a)} vs ${C(d).nm} AP${apOf(d)}`);
  render();
  const firstIsDef=apOf(ct.d)<=apOf(ct.a); // 同値は非ターンプレイヤーが1番目
  const order=firstIsDef?[o,p]:[p,o];
  const acted={};
  const turnOf=async q=>{const r=await contactRight(q,ct,p);if(r)acted[q.idx]=true;return r};
  const r1=await turnOf(order[0]);
  const r2=await turnOf(order[1]);
  if(!r1&&r2)await turnOf(order[0]);
  const A=apOf(ct.a),D=apOf(ct.d);
  log(`判定: ${C(ct.a).nm} AP${A} vs ${C(ct.d).nm} AP${D}`);
  const won=A>=D;
  for(const x of [ct.a,ct.d])x.apC=0;
  G.contact=null;
  if(won){removeCard(ct.d,"コンタクト",{by:p});render();await FX.contactWin(p,ct.a,ct.d)}else log("　アクションした側のAPが低いので何も起きない","n");
  render();await runQueue();
}
async function contactRight(q,ct,tp){
  if(G.over)return false;
  const mine=q===tp?ct.a:ct.d,theirs=q===tp?ct.d:ct.a;
  const cuts=q.hand.filter(x=>C(x).ci);
  const dis=q.hand.filter(x=>C(x).t==="キャラ"&&C(x).dg&&disguiseOk(x,q));
  if(!cuts.length&&!dis.length)return false;
  let choice=null;
  if(q.cpu)choice=cpuContact(q,mine,theirs,cuts,tp);
  else{
    const opts=[...cuts,...dis];
    const sel=await chooseCards(`${q.name}: コンタクト中の行動`,`自分 ${C(mine).nm} AP${apOf(mine)} / 相手 ${C(theirs).nm} AP${apOf(theirs)}\nカットインか変装を1枚使えます（パス可）。`,opts,{min:0,max:1,okLabel:"使う"});
    if(sel.length){const x=sel[0];
      if(C(x).ci&&C(x).dg&&dis.includes(x)){choice={x,how:await ask("どちらで使う？","",[{label:"カットイン",value:"cut",primary:true},{label:"変装",value:"dis"}])}}
      else choice={x,how:C(x).ci?"cut":"dis"}}
  }
  if(!choice){log(`${q.name} はパス`,"n");return false}
  const x=choice.x;
  if(q.cpu){render();await cutin(x,`${q.name}: ${choice.how==="cut"?"カットイン":"変装"}`,choice.how==="cut"?(C(x).ci||"").split("\n")[0]:`${C(mine).nm} → ${C(x).nm}`,{who:q})}
  if(choice.how==="cut"){
    const v=cutinAp(x,q);detach(x);q.rm.push(x);
    if(v!=null){mine.apC+=v;log(`${q.name} はカットイン ${C(x).nm}: ${C(mine).nm} AP＋${v}（AP${apOf(mine)}）`)}
    else{log(`${q.name} はカットイン ${C(x).nm}: ${C(x).ci.replace(/\n/g," ")}`);if(!FX.has(x,"cutin"))toast("カットイン効果を手動で処理")}
    await FX.cutin(q,x,mine);
  }else{
    detach(x);const fi=q.field.indexOf(mine);
    Object.assign(x,{st:mine.st,apM:mine.apM,apT:mine.apT,apC:mine.apC,lpM:mine.lpM,lpT:mine.lpT,kw:mine.kw.slice(),fresh:mine.fresh});
    q.field[fi]=x;resetMods(mine);q.deck.push(mine);
    if(ct.a===mine)ct.a=x;else ct.d=x;
    log(`${q.name} は ${C(mine).nm} を ${C(x).nm} に変装（AP${apOf(x)}）`);
    render();await FX.disguise(q,x);
  }
  render();
  if(!q.cpu)await sleep(50);
  return true;
}

function cpuGuard(o,atk,target,guards){
  const A=apOf(atk);
  const strong=guards.filter(g=>apOf(g)>A).sort((a,b)=>apOf(a)-apOf(b));
  if(target==="case")return strong[0]||null;
  if(apOf(target)>A)return null; // 対象が勝てるならガード不要
  return strong[0]||null;
}
function cpuContact(q,mine,theirs,cuts,tp){
  const need=q===tp?apOf(theirs)-apOf(mine):apOf(theirs)-apOf(mine)+1; // 攻撃側は同値で勝ち
  if(need<=0)return null;
  const c=cuts.map(x=>({x,v:cutinAp(x,q)})).filter(o=>o.v!=null&&o.v>=need).sort((a,b)=>a.v-b.v);
  if(c.length)return {x:c[0].x,how:"cut"};
  return null;
}
async function cpuTurn(p){
  const step=async ms=>{clearAct();render();await sleep(window.SIM_FAST?(ms||450):(ms||450)*1.8)};
  await step(600);
  const o=opp(p);
  // 1) 事件解決
  if(p.solved&&p.pLoc==="area"&&p.partner.st==="a"&&p.ev.length>=p.level){solve(p);return}
  // 2) 手札の使用（基本方針: 毎ターン必ず使う。相手のキャラを減らす効果を優先）
  const best=viaHint=>{
    const cs=p.hand.filter(x=>!playableReason(p,x,viaHint)&&(C(x).t==="キャラ"||FX.eventAi(p,x)));
    const score=x=>{const c=C(x);let v=(c.lv||0)*10;
      if(c.t==="イベント")v+=/リムーブする|デッキの下|スタン/.test(c.f||"")?45:(c.lv||0)<=2?8:20;
      if(c.t==="キャラ"&&/【登場時】[^\n]*(リムーブ|スタン)/.test(c.f||"")&&FX.automated(x))v+=25;
      if(c.t==="キャラ"&&p.field.length>=5)v-=30;
      return v};
    return cs.sort((a,b)=>score(b)-score(a))[0]||null};
  let pick1=best(false);
  if(pick1){await useFromHand(p,pick1);await step()}
  if(G.over)return;
  const fileCards=()=>p.file.filter(x=>x!==p.partner).length;
  if(!p.noHint&&!p.hinted&&(!pick1&&fileCards()>=4||pick1&&fileCards()>=6&&p.field.length<4)){
    await nextHint(p);await step();
    const c2=best(true);if(c2){await useFromHand(p,c2,true);await step()}
  }
  if(G.over)return;
  // 2.5) 宣言能力
  for(let guard=0;guard<8;guard++){
    let used=false;
    for(const x of [...p.field,p.caseC]){
      for(const ab of FX.abilities(p,x)){
        if(!ab.ok||ab.noAi)continue;if(ab.aiCan&&!ab.aiCan(p,x))continue;
        await showCpu(p,x,"能力",ab.label);await FX.useAbility(p,x,ab);await step();used=true;break}
      if(used||G.over)break}
    if(!used||G.over)break}
  if(G.over)return;
  // 3) キャラへのアクション（勝てる相手）
  for(;;){
    const atks=p.field.filter(x=>canAct(x,p,"chara")).sort((a,b)=>apOf(b)-apOf(a));
    const tg=o.field.filter(y=>y.st!=="a").sort((a,b)=>(C(b).lv||0)-(C(a).lv||0));
    let done=false;
    for(const t of tg){const a=atks.find(x=>apOf(x)>=apOf(t));if(a){await declareAction(p,a,t);await step();done=true;break}}
    if(!done||G.over)break;
  }
  if(G.over)return;
  // 4) 事件へのアクション / 推理
  const keep=p.field.length>=3?1:0;
  let actors=p.field.filter(x=>x.st==="a").sort((a,b)=>lpOf(b)-lpOf(a));
  let left=actors.length;
  for(const x of actors){
    if(G.over)return;
    if(left<=keep)break;
    if(lpOf(x)>=1&&canAct(x,p,"reason")){await reason(p,x);left--;await step();continue}
    if(o.ev.length>0&&canAct(x,p,"case")){await declareAction(p,x,"case");left--;await step()}
  }
  if(G.over)return;
  // 5) パートナー
  if(p.pLoc==="area"&&p.partner.st==="a"){
    if(!p.solved&&p.file.length>=6)await assist(p);
    else if(p.solved&&p.ev.length>=p.level)solve(p);
    else await reason(p,p.partner);
    await step();
  }
  if(G.over)return;
  log(`${p.name} はターン終了`,"n");await step(300);
  endTurn();
}

   <span class="meta" style="color:var(--ink-dim)">${G.over?"":`手札の使用 ${p.usedHand?"済":"可"}・ネクストヒント ${p.hinted?"済":"可"}`}</span>`);

  const b=(l,f,o={})=>{const e=document.createElement("button");e.textContent=l;if(o.primary)e.className="primary";if(o.cls)e.classList.add(...o.cls.split(" "));e.disabled=!!o.disabled;e.onclick=f;T.appendChild(e)};
  const R=document.documentElement;
  b("ログ",()=>{R.classList.toggle("logopen");R.classList.remove("menuopen");const L=document.getElementById("log");L.scrollTop=L.scrollHeight},{cls:"tb-only"});
  b("≡",()=>{R.classList.toggle("menuopen");R.classList.remove("logopen")},{cls:"tb-only"});
  b("ネクストヒント",()=>nextHint(p),{cls:"fab tb-hint",disabled:!human||p.hinted||!p.file.some(x=>x!==p.partner)});
  b("ターン終了",()=>{if(G.ui.mode)G.ui.mode=null;endTurn()},{primary:true,cls:"fab tb-end",disabled:!human});
  if(G.cfg.cpu){b(G.showOppHand?"相手の手札を隠す":"相手の手札を見る",()=>{G.showOppHand=!G.showOppHand;render()},{cls:"tb-extra"})}
  b("降参",async()=>{const v=await ask("降参しますか？","",[{label:"降参する",value:true},{label:"続ける",value:false,primary:true}]);if(v)lose(human?p:me,"降参")},{cls:"tb-extra"});
  b("デッキ選択へ",async()=>{const v=await ask("対戦を中断してデッキ選択に戻りますか？","",[{label:"戻る",value:true},{label:"続ける",value:false,primary:true}]);if(v)showSetup()},{cls:"tb-extra"});
}
function renderGuide(){
  const g=document.getElementById("guide");const p=cur();let cls="",h="",t="";
  if(G.over){cls="wait";h="対戦終了";t="「デッキ選択へ」で別のデッキを選べます。"}
  else if(G.ui.mode&&G.ui.mode.kind==="target"){cls="target";h="アクションの対象を選ぶ";t=`${C(G.ui.mode.atk).nm} のアクション先: 相手の赤く点滅しているキャラをクリック（Escでキャンセル）`}
  else if(p.cpu){cls="wait";h=`${p.name} のターン`;t="CPUが行動中です。ガードやカットインを聞かれたら画面に選択肢が出ます。"}
  else{h=`${p.name} のメインフェイズ（FILE ${p.file.length}枚＝レベル${p.file.length}まで使える）`;
    const steps=[];
    if(!p.usedHand&&!p.hinted)steps.push(p.hand.some(x=>!playableReason(p,x,false))?"① 緑枠の手札をクリックして使う（ネクストヒントも可）":"① 使える手札がない → ネクストヒントも検討");
    else if(!p.hinted)steps.push("① 手札の使用は済み（ネクストヒントはまだ使える）");
    else steps.push("① ネクストヒント済み（手札の使用は不可）");
    const ready=p.field.filter(x=>canAct(x,p,"reason")||canAct(x,p,"chara")||canAct(x,p,"case")).length+(p.pLoc==="area"&&p.partner.st==="a"?1:0);
    steps.push(ready?`② 緑枠の現場・パートナー（${ready}枚）をクリックして推理／アクション`:"② 動けるカードはもうない");
    if(p.solved&&p.ev.length>=p.level&&p.pLoc==="area"&&p.partner.st==="a")steps.push("★ パートナーで事件解決できます！");
    steps.push("③ 終わったら「ターン終了」");t=steps.join("　")}
  g.className=cls;g.innerHTML=`<b>${esc(h)}</b><span>${esc(t)}</span>`;
}
function sideEl(p,top){
  const s=document.createElement("section");s.className="side"+(top?" opp":" me")+(G.turn===p.idx?" active-turn":"");
  const showHand=!p.cpu&&(top?!G.cfg.cpu:true)||p.cpu&&G.showOppHand;
  // 左: 事件・パートナー
  const sp=document.createElement("div");sp.className="special";
  const box=el=>{const w=document.createElement("div");w.appendChild(el);sp.appendChild(w)};
  const ce=cardEl(p.caseC);if(p.solved)ce.insertAdjacentHTML("beforeend",'<span class="case-tag">解決編</span>');
  ce.onclick=()=>showDetail(p.caseC,true);box(ce);
  if(p.pLoc==="area"){const pe=cardEl(p.partner);if(G.ui.act&&G.ui.act.a===p.partner)pe.classList.add("acting");if(!p.cpu&&G.turn===p.idx&&!G.over&&p.partner.st==="a")pe.classList.add("ready");pe.onclick=()=>showDetail(p.partner,true);box(pe)}
  else{const d=document.createElement("div");d.className="slot";d.innerHTML='<span style="color:var(--ink-dim);font-size:11px;text-align:center">パートナー<br>FILE中</span>';sp.appendChild(d)}
  // 中: 現場
  const sl=document.createElement("div");sl.className="slots";
  const human=!p.cpu&&G.turn===p.idx&&!G.over;
  for(const x of p.field){const e=cardEl(x);if(x===_sel)e.classList.add("sel");
    if(x._shown!=="field"){x._shown="field";if(!window.SIM_FAST)e.classList.add("justin")}
    if(G.ui.act){if(G.ui.act.a===x)e.classList.add("acting");if(G.ui.act.t===x)e.classList.add("targeted")}
    if(human&&(canAct(x,p,"reason")||canAct(x,p,"chara")||canAct(x,p,"case")))e.classList.add("ready");
    if(G.ui.mode&&G.ui.mode.kind==="target"&&p!==cur()&&x.st!=="a")e.classList.add("tgt");
    e.onclick=()=>{
      if(G.ui.mode&&G.ui.mode.kind==="target"&&p!==cur()){const a=G.ui.mode.atk;G.ui.mode=null;declareAction(cur(),a,x);return}
      showDetail(x,true)};
    sl.appendChild(e)}
  for(let i=p.field.length;i<5;i++){const d=document.createElement("div");d.className="slot";sl.appendChild(d)}
  // 右: 山札類（カードを置いた見た目）
  const inf=document.createElement("div");inf.className="pinfo";
  inf.innerHTML=`<div class="pname">${esc(p.name)}${p.cpu?"（CPU）":""}</div>`;
  const pile=(cls,label,n,kind,inner)=>{const w=document.createElement("div");
    const d=document.createElement("div");d.className="stack "+cls+(n?"":" empty");d.tabIndex=0;d.title=label;
    const depth=Math.min(6,Math.ceil(n/6));d.style.boxShadow=Array.from({length:depth},(_,i)=>`${i+1}px ${i+1}px 0 #0b141b`).join(",")||"none";
    d.innerHTML=inner||(n?`<span class="cnt">${n}</span>`:"");d.onclick=()=>pileMenu(p,kind);
    w.appendChild(d);w.insertAdjacentHTML("beforeend",`<div class="plabel">${label}</div>`);inf.appendChild(w)};
  pile("","デッキ",p.deck.length,"deck");
  const topRm=p.rm[p.rm.length-1];
  pile("rm",`リムーブ <b>${p.rm.length}</b>`,p.rm.length,"rm",topRm?esc(C(topRm).nm):"");
  // FILE と 証拠: 伏せたカードを横一列に重ねて置く（次の枠に番号、目標の枠は強調）
  const row=(kind,label,list,minSlots,goal,goalLabel,cls)=>{
    const fz=document.createElement("div");fz.className="filez "+cls;fz.tabIndex=0;fz.onclick=()=>pileMenu(p,kind);fz.title=label+"（クリックで中身）";
    fz.innerHTML=`<div class="flabel">${label}<b>${list.length}</b></div>`;
    const fs=document.createElement("div");fs.className="fstack";
    const n=list.length,W=document.documentElement.classList.contains("compact")?(window.innerWidth<500?window.innerWidth-120:300):400,slots=Math.max(minSlots,n);
    const fw=document.documentElement.classList.contains("compact")?32:46;
    const pitch=Math.min(fw-2,(W-fw)/(slots-1));
    list.forEach((x,i)=>{const f=document.createElement("div");f.className="fcard"+(x===p.partner?" partner":"")+(x.up?" up":"");f.style.left=(i*pitch)+"px";
      if(x===p.partner)f.textContent="パートナー";else if(x.up){f.textContent=C(x).nm;f.title="表向き: "+C(x).nm}fs.appendChild(f)});
    for(let k=n+1;k<=slots;k++){const g=document.createElement("div");g.className="fghost"+(k===goal?" goal":"");g.style.left=((k-1)*pitch)+"px";g.textContent=k;if(k===goal)g.dataset.goal=goalLabel;fs.appendChild(g)}
    fz.appendChild(fs);return fz};
  const fz=document.createElement("div");fz.className="fzwrap";
  const fileRow=row("file","FILE",p.file,9,7,"解決編","");
  const evRow=row("ev","証拠",p.ev,Math.max(p.level,7),p.level,"勝利","evz");
  if(top)fz.append(evRow,fileRow);else fz.append(fileRow,evRow);
  // 手札
  const hd=document.createElement("div");hd.className="hand";
  if(showHand){const fan=!top&&document.documentElement.classList.contains("portrait"),hn=p.hand.length,
    hov=fan&&hn>1?Math.max(-50,Math.min(4,(window.innerWidth-48-hn*68)/(hn-1))):0;let hi=0;
   for(const x of p.hand){const e=cardEl(x);
    if(fan){const k=hi-(hn-1)/2,sp=Math.min(4,18/Math.max(1,hn));e.style.setProperty("--r",(k*sp)+"deg");e.style.setProperty("--y",Math.min(14,k*k*1.6)+"px");if(hi)e.style.marginLeft=hov+"px"}hi++;if(G.turn===p.idx&&!p.cpu&&!playableReason(p,x,false))e.classList.add("playable");if(x===_sel)e.classList.add("sel");e.onclick=()=>showDetail(x,true);hd.appendChild(e)}}
  else{const bk=document.createElement("div");bk.className="backs";bk.innerHTML=p.hand.map(()=>'<span class="back"></span>').join("")+`<span style="margin-left:6px">手札 ${p.hand.length}枚</span>`;hd.appendChild(bk)}
  s.append(sp,sl,inf,hd,fz);
  return s;
}
document.addEventListener("keydown",e=>{if(e.key!=="Escape"||!G||!document.getElementById("modal-bg").hidden)return;if(G.ui.mode){G.ui.mode=null;render();toast("キャンセル")}else if(_sel)clearSel()});

// ================= セットアップ画面 =================
function showSetup(){
  G=null;
  document.getElementById("app").hidden=true;const S=document.getElementById("setup");S.hidden=false;
  let saved={};try{saved=JSON.parse(localStorage.getItem("conan-sim-setup")||"{}")}catch(e){}
  S.innerHTML=`<div><h1 style="font-size:24px">コナンTCG 卓上シミュレータ</h1>
   <div class="hint">ルールマニュアル Ver.2.5 準拠の進行（オート・手札の使用・ネクストヒント・推理・アクション・ガード・コンタクト・ミスリード・ヒラメキ・リフレッシュ・事件解決）を自動で処理します。カード個別の効果は表示のみで、右パネルの手動操作で処理します。収録カード ${window.CARD_DB.length} 枚。</div></div>
   <div class="cols">
    ${[0,1].map(i=>`<div class="box"><b>${i===0?"あなた（下側）":"相手（上側）"}</b>
      <div class="row"><input id="nm${i}" value="${esc(saved["nm"+i]||(i?"相手":"あなた"))}" size="10" aria-label="名前">
      ${i===1?`<label><input type="checkbox" id="cpu1" ${saved.cpu1===false?"":"checked"}> CPUが操作</label>`:`<label><input type="checkbox" id="cpu0"> CPUが操作（観戦）</label>`}</div>
      <div class="row"><select id="ps${i}" aria-label="初期デッキ">${PRESETS.map((d,k)=>`<option value="${k}" ${k===(i?1:0)?"selected":""}>${esc(d.name)}</option>`).join("")}</select><button data-s="${i}">このデッキを使う</button></div>
      <div class="row">
        <select id="rc${i}" aria-label="ランダム構築の色">${["青","赤","黄","緑","白","黒"].map(c=>`<option>${c}</option>`).join("")}</select><button data-r="${i}">ランダム構築</button></div>
      <div class="row"><input id="sh${i}" placeholder="共有ID 例: X3zM3U7m" size="16"><button data-f="${i}">conan-tcg-appから読込</button></div>
      <textarea id="dk${i}" spellcheck="false" aria-label="デッキリスト">${esc(saved["dk"+i]||PRESETS[i?1:0].text)}</textarea>
      <div class="dmsg" id="dm${i}"></div></div>`).join("")}
   </div>
   <div class="row"><label>先攻: <select id="first"><option value="rand">ランダム</option><option value="0">あなた</option><option value="1">相手</option></select></label>
     <button class="primary" id="go" style="font-size:14px;padding:8px 18px">対戦開始</button></div>
   <div class="hint">デッキリストの書き方: 1行に「カードNo x枚数」。パートナーと事件はカードNoを書けば自動で判別します。conan-tcg-app の共有IDでの読込はブラウザから直接通信するため、環境によっては失敗します。その場合はリストを貼り付けてください。<br>
   操作: カードをクリックすると右パネルに操作が出ます。アクション［キャラ］は対象（赤く点滅）をクリック、Escでキャンセル。デッキ・FILE・証拠・リムーブの枚数をクリックすると中身と手動操作が開きます。</div>`;
  const chk=i=>{const d=parseDeckText(document.getElementById("dk"+i).value);const w=[...d.errors,...validateDeck(d)];const m=document.getElementById("dm"+i);
    if(w.length){m.className="dmsg bad";m.textContent=w.join("\n")}else{m.className="dmsg good";m.textContent=`OK: ${C({n:d.partner}).nm} / ${C({n:d.caseN}).nm} / 40枚`}return {d,w}};
  for(const i of [0,1]){
    const ta=document.getElementById("dk"+i);ta.oninput=()=>chk(i);chk(i);
    S.querySelector(`[data-s="${i}"]`).onclick=()=>{ta.value=PRESETS[+document.getElementById("ps"+i).value].text;chk(i)};
    S.querySelector(`[data-r="${i}"]`).onclick=()=>{ta.value=randomDeck(document.getElementById("rc"+i).value).text;chk(i)};
    S.querySelector(`[data-f="${i}"]`).onclick=async()=>{const id=document.getElementById("sh"+i).value.trim().replace(/.*deck\//,"");const m=document.getElementById("dm"+i);
      m.className="dmsg";m.textContent="読込中…";try{const r=await fetchShareDeck(id);ta.value=r.text;chk(i);m.textContent+=`（${r.name}）`}catch(e){m.className="dmsg bad";m.textContent="読み込めませんでした（"+e.message+"）。リストを貼り付けてください。"}};
  }
  document.getElementById("go").onclick=()=>{
    const a=chk(0),b=chk(1);
    if(!a.d.partner||!a.d.caseN||!b.d.partner||!b.d.caseN||a.d.main.length<10||b.d.main.length<10){toast("デッキを確認してください");return}
    const cfg={decks:[a.d,b.d],names:[document.getElementById("nm0").value||"あなた",document.getElementById("nm1").value||"相手"],cpu:document.getElementById("cpu1").checked,cpu0:document.getElementById("cpu0").checked,first:document.getElementById("first").value};
    try{localStorage.setItem("conan-sim-setup",JSON.stringify({nm0:cfg.names[0],nm1:cfg.names[1],dk0:document.getElementById("dk0").value,dk1:document.getElementById("dk1").value,cpu1:cfg.cpu}))}catch(e){}
    startGame(cfg);
  };
}
// スマホ（縦・横）ではコンパクト表示
function applyCompact(){const r=document.documentElement;const mq=window.matchMedia("(max-width: 760px), (max-height: 520px)").matches;
  const was=r.classList.contains("compact");r.classList.toggle("compact",mq);r.classList.toggle("portrait",mq&&window.innerHeight>window.innerWidth);
  document.getElementById("detail").classList.toggle("zoom",mq);
  if(G&&was!==mq)render()}
// 空白をタップ: アクションの対象選びや選択中のカードをキャンセル
document.addEventListener("click",e=>{if(!G||!document.getElementById("modal-bg").hidden)return;
  if(e.target.closest("#detail,.card,.stack,.filez,#modal,#topbar,button,details,#peek,.cutin,#reveal,#setup,a,input,select,textarea"))return;
  if(G.ui.mode){G.ui.mode=null;render();toast("キャンセルしました");return}
  if(_sel)clearSel()});
// カードを長押し: 効果を大きく表示（選択はしない）
const LP={t:null,fired:false,x0:0,y0:0};
function showPeek(x){
  const c=C(x);const old=document.getElementById("peek");if(old)old.remove();
  const d=document.createElement("div");d.id="peek";
  const parts=[c.dg,c.hr,c.ci,c.f].filter(Boolean).join("\n\n");
  d.innerHTML=`<div class="pk"><div class="pkc"></div><div class="pkt"><div class="dn">${esc(c.nm)}</div><div class="meta">${esc(c.t)}・${esc(c.c||"-")}${c.lv!=null?"・Lv"+c.lv:""}${c.ap!=null?"・AP"+c.ap:""}${c.lp!=null?"・LP"+c.lp:""}${c.ct?"・"+esc(c.ct):""}</div><div class="eff">${parts?hl(parts):'<span class="meta">効果なし</span>'}</div><div class="meta" style="margin-top:8px">タップで閉じる</div></div></div>`;
  const ce=cardEl(x);ce.classList.remove("s-s","s-x");d.querySelector(".pkc").appendChild(ce);
  d.onclick=ev=>{ev.stopPropagation();d.remove()};
  document.body.appendChild(d);
}
document.addEventListener("pointerdown",e=>{const el=e.target.closest(".card");if(!el||!el._x||el.classList.contains("facedown")||el.closest("#peek"))return;
  LP.fired=false;LP.x0=e.clientX;LP.y0=e.clientY;clearTimeout(LP.t);
  LP.t=setTimeout(()=>{LP.fired=true;showPeek(el._x)},450)});
document.addEventListener("pointermove",e=>{if(LP.t&&Math.hypot(e.clientX-LP.x0,e.clientY-LP.y0)>10){clearTimeout(LP.t);LP.t=null}});
for(const ev of ["pointerup","pointercancel"])document.addEventListener(ev,()=>{clearTimeout(LP.t);LP.t=null});
document.addEventListener("click",e=>{if(LP.fired){LP.fired=false;e.stopPropagation();e.preventDefault()}},true); // 長押し後のタップは無効
document.addEventListener("contextmenu",e=>{if(e.target.closest(".card"))e.preventDefault()});
document.getElementById("detail").addEventListener("click",e=>{if(e.target.id==="detail"||e.target.classList.contains("zoomcard"))clearSel()});
applyCompact();window.addEventListener("resize",()=>{applyCompact();if(G)render()});
showSetup();
</script>
